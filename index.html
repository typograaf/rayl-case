<!doctype html>
<!--
  The Rayl case, as a page: Figma node 2110:7067, which is 2016 wide — twelve
  tiles of 1920 on black, 48 in from the edges and 33 apart. Everything is
  measured in --u, one pixel of that frame, so the page is the frame at
  whatever width the window is.

  The eighth tile is not a picture: it is the generator itself, the Rayl
  Stack try-out, in a frame. It scales itself to the frame it is given; the
  tile clips it to the page's own corner.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayl</title>
    <meta name="description" content="Rayl — flexible work, sorted." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23696961'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23cfcfc1'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --u: calc(100vw / 2016);
        --corner: calc(24 * var(--u));
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: #000;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: calc(33 * var(--u));
        padding: calc(48 * var(--u));
      }

      img,
      video,
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      img,
      video {
        object-fit: cover;
      }

      /* A tile: 1920 by 1080, cornered like every other. */
      .tile {
        aspect-ratio: 16 / 9;
        border-radius: var(--corner);
        overflow: hidden;
      }

      /* Two portraits side by side, 876 by 1095, 72 in and 24 apart. */
      .pair {
        display: flex;
        justify-content: center;
        gap: calc(24 * var(--u));
        padding: calc(72 * var(--u));
      }

      .pair > div {
        width: calc(876 * var(--u));
        aspect-ratio: 876 / 1095;
        border-radius: var(--corner);
        overflow: hidden;
      }

      /* The stand from four sides: four cells, 12 in and 12 apart. */
      .four {
        aspect-ratio: 16 / 9;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: calc(12 * var(--u));
        padding: calc(12 * var(--u));
      }

      .four > div {
        display: grid;
        place-items: center;
        border-radius: var(--corner);
        overflow: hidden;
        background: #262623;
      }

      .four img {
        width: calc(741 * var(--u));
        height: calc(417 * var(--u));
      }

      /* The generator. Its ground until it has loaded is its own panel's. */
      .live {
        background: #262623;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tile">
        <video
          src="assets/hero.mp4"
          poster="assets/hero.jpg"
          aria-label="Rayl — flexible work, sorted. A row of baskets, with: Ready to get your work sorted?"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
        ></video>
      </div>

      <div class="pair">
        <div><video
          src="assets/mark.mp4"
          poster="assets/mark.jpg"
          aria-label="The Rayl mark"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
        ></video></div>
        <div>
          <img
            src="assets/tablet.webp"
            alt="The Rayl site on a tablet"
            loading="lazy"
          />
        </div>
      </div>

      <div class="tile">
        <video
          src="assets/process.mp4"
          poster="assets/process.jpg"
          aria-label="Four windows of the Rayl generator, with plates and baskets in different arrangements"
          autoplay
          muted
          loop
          playsinline
          preload="none"
        ></video>
      </div>

      <div class="tile">
        <img
          src="assets/billboard.webp"
          alt="A Rayl billboard: Somebody always drops out at five."
          loading="lazy"
        />
      </div>

      <div class="four">
        <div>
          <img
            src="assets/stand-front.webp"
            alt="The Rayl stand, from the front"
            loading="lazy"
          />
        </div>
        <div>
          <img
            src="assets/stand-left.webp"
            alt="The Rayl stand, from the left"
            loading="lazy"
          />
        </div>
        <div>
          <img
            src="assets/stand-right.webp"
            alt="The Rayl stand, from the right"
            loading="lazy"
          />
        </div>
        <div>
          <img
            src="assets/stand-top.webp"
            alt="The Rayl stand, from above"
            loading="lazy"
          />
        </div>
      </div>

      <div class="tile">
        <img
          src="assets/stand-hall.webp"
          alt="The Rayl stand in a trade-fair hall"
          loading="lazy"
        />
      </div>

      <div class="tile">
        <video
          src="assets/variants.mp4"
          poster="assets/variants.jpg"
          aria-label="The Rayl key visual laid out across several formats"
          autoplay
          muted
          loop
          playsinline
          preload="none"
        ></video>
      </div>

      <div class="tile live">
        <iframe
          src="generator/index.html"
          title="The Rayl generator: choose a subject, a direction, the lighting and the motion"
          loading="lazy"
        ></iframe>
      </div>

      <div class="pair">
        <div>
          <img
            src="assets/jacket.webp"
            alt="A white Rayl jacket"
            loading="lazy"
          />
        </div>
        <div>
          <img
            src="assets/label.webp"
            alt="The label on the Rayl jacket"
            loading="lazy"
          />
        </div>
      </div>

      <div class="tile">
        <img
          src="assets/screens.webp"
          alt="Rayl on a row of large screens"
          loading="lazy"
        />
      </div>

      <div class="tile">
        <img src="assets/car.webp" alt="A Rayl car" loading="lazy" />
      </div>
    </main>
    <script>
      /* The films further down are not fetched until they are nearly in
         view, and none of them runs while it is out of sight. */
      const seen = new IntersectionObserver(
        (entries) => {
          for (const { target, isIntersecting } of entries) {
            if (isIntersecting) target.play().catch(() => {});
            else target.pause();
          }
        },
        { rootMargin: "400px 0px" },
      );
      for (const film of document.querySelectorAll("video")) seen.observe(film);
    </script>
  </body>
</html>
